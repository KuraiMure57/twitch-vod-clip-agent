name: Telegram Listener

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  telegram-listener:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # COMPROBAR SI EL PIPELINE YA ESTÁ EJECUTÁNDOSE
      # ============================================================

      - name: Check VOD pipeline status
        id: pipeline_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Checking VOD pipeline status"
          echo "========================================="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?per_page=20")

          echo "$RESPONSE" > workflow_runs.json

          python - <<'PY'
          import json

          with open(
              "workflow_runs.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          running_states = {
              "queued",
              "in_progress",
              "waiting",
              "requested",
              "pending",
          }

          running = False

          for run in data.get(
              "workflow_runs",
              [],
          ):
              if run.get("status") in running_states:
                  running = True
                  break

          with open(
              "pipeline_running.txt",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(
                  "true" if running else "false"
              )

          print(
              f"Pipeline running: {running}"
          )
          PY

          RUNNING=$(cat pipeline_running.txt)

          echo "Pipeline running: $RUNNING"

          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"


      # ============================================================
      # LEER Y CONSUMIR TELEGRAM
      # ============================================================

      - name: Get Telegram updates
        id: telegram_updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Checking Telegram"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]

          allowed_chat_id = str(
              os.environ["TELEGRAM_CHAT_ID"]
          )

          params = {
              "timeout": "5",
              "allowed_updates": json.dumps(
                  ["message"]
              ),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as exc:
              print(
                  f"ERROR: Telegram request failed: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram API returned an error."
              )
              print(data)
              raise SystemExit(1)

          updates = data.get(
              "result",
              [],
          )

          print(
              f"Telegram updates received: "
              f"{len(updates)}"
          )

          command_update = None

          max_update_id = None

          for update in updates:

              update_id = update.get(
                  "update_id"
              )

              if isinstance(
                  update_id,
                  int,
              ):
                  if (
                      max_update_id is None
                      or update_id > max_update_id
                  ):
                      max_update_id = update_id

              message = update.get(
                  "message"
              )

              if not message:
                  continue

              chat = message.get(
                  "chat",
                  {},
              )

              chat_id = str(
                  chat.get(
                      "id",
                      "",
                  )
              )

              if chat_id != allowed_chat_id:
                  continue

              text = message.get(
                  "text",
                  "",
              ).strip()

              print(
                  f"Authorized Telegram message: "
                  f"update_id={update_id} "
                  f"text={text!r}"
              )

              if (
                  text == "/start"
                  or text.startswith("/start@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "start",
                  }

              elif (
                  text == "/estado"
                  or text.startswith("/estado@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "estado",
                  }

              elif (
                  text == "/help"
                  or text.startswith("/help@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "help",
                  }


          # ========================================================
          # CONFIRMAR LOS UPDATES RECIBIDOS
          #
          # Telegram no elimina los updates simplemente por leerlos.
          # Al volver a llamar con offset=max_update_id+1,
          # confirmamos todos los updates anteriores.
          # ========================================================

          if max_update_id is not None:

              confirm_offset = (
                  max_update_id + 1
              )

              confirm_params = {
                  "offset": str(
                      confirm_offset
                  ),
                  "allowed_updates": json.dumps(
                      ["message"]
                  ),
              }

              confirm_url = (
                  f"https://api.telegram.org/bot{bot_token}/getUpdates?"
                  + urllib.parse.urlencode(
                      confirm_params
                  )
              )

              try:
                  with urllib.request.urlopen(
                      confirm_url,
                      timeout=15,
                  ) as response:

                      confirm_data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

              except Exception as exc:
                  print(
                      "ERROR: Could not confirm "
                      f"Telegram updates: {exc}"
                  )
                  raise SystemExit(1)

              if not confirm_data.get(
                  "ok"
              ):
                  print(
                      "ERROR: Telegram update "
                      "confirmation failed."
                  )
                  print(confirm_data)
                  raise SystemExit(1)

              print(
                  "Telegram updates consumed successfully."
              )

              print(
                  f"Confirmed offset: "
                  f"{confirm_offset}"
              )

          else:
              print(
                  "No Telegram updates to consume."
              )


          # ========================================================
          # GUARDAR COMANDO
          # ========================================================

          if command_update is None:

              print(
                  "No supported command found."
              )

              with open(
                  "telegram_command.json",
                  "w",
                  encoding="utf-8",
              ) as file:

                  json.dump(
                      {},
                      file,
                      indent=2,
                  )

              raise SystemExit(0)


          print()

          print(
              "========================================="
          )

          print(
              "TELEGRAM COMMAND DETECTED"
          )

          print(
              "========================================="
          )

          print(
              f"Command: "
              f"{command_update['command']}"
          )

          print(
              f"Update ID: "
              f"{command_update['update_id']}"
          )

          with open(
              "telegram_command.json",
              "w",
              encoding="utf-8",
          ) as file:

              json.dump(
                  command_update,
                  file,
                  indent=2,
              )
          PY


      # ============================================================
      # /HELP
      # ============================================================

      - name: Process /help
        if: steps.telegram_updates.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" != "help" ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          text = (
              "📖 Comandos disponibles:\n\n"
              "/start → Inicia un nuevo procesamiento.\n"
              "/estado → Consulta el estado del procesamiento.\n"
              "/help → Muestra los comandos disponibles."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:

              data = json.loads(
                  response.read().decode(
                      "utf-8"
                  )
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Help message sent."
          )
          PY


      # ============================================================
      # /ESTADO
      # ============================================================

      - name: Process /estado
        if: steps.telegram_updates.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" != "estado" ]; then
            exit 0
          fi

          echo "========================================="
          echo "Checking latest VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?per_page=1")

          echo "$RESPONSE" > latest_run.json

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open(
              "latest_run.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          runs = data.get(
              "workflow_runs",
              [],
          )

          if not runs:

              status_text = (
                  "⚪ Sin proceso en curso."
              )

          else:

              run = runs[0]

              status = run.get(
                  "status"
              )

              conclusion = run.get(
                  "conclusion"
              )

              if status in {
                  "queued",
                  "in_progress",
                  "waiting",
                  "requested",
                  "pending",
              }:

                  status_text = (
                      "🟢 Procesando.\n\n"
                      "El Proyecto 2 está "
                      "trabajando en el último VOD."
                  )

              elif conclusion == "success":

                  status_text = (
                      "⚪ Sin proceso en curso.\n\n"
                      "El último procesamiento "
                      "terminó correctamente."
                  )

              elif conclusion == "failure":

                  status_text = (
                      "❌ Fallo.\n\n"
                      "El último procesamiento "
                      "ha terminado con errores."
                  )

              elif conclusion == "cancelled":

                  status_text = (
                      "❌ Procesamiento cancelado.\n\n"
                      "El último procesamiento "
                      "fue cancelado."
                  )

              else:

                  status_text = (
                      "⚪ Sin proceso en curso."
                  )

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": status_text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:

              telegram_result = json.loads(
                  response.read().decode(
                      "utf-8"
                  )
              )

          if not telegram_result.get("ok"):
              raise RuntimeError(
                  telegram_result
              )

          print(
              "Status sent to Telegram."
          )
          PY


      # ============================================================
      # COMPROBAR /START
      # ============================================================

      - name: Check /start command
        id: start_check
        if: steps.telegram_updates.outcome == 'success'
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" = "start" ]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
          else
            echo "start=false" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # SI YA ESTÁ PROCESANDO
      # ============================================================

      - name: Inform that pipeline is already running
        if: |
          steps.start_check.outputs.start == 'true' &&
          steps.pipeline_status.outputs.running == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          text = (
              "🟢 El Proyecto 2 ya está "
              "procesando un VOD.\n\n"
              "No se ha iniciado otro proceso."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:

              data = json.loads(
                  response.read().decode(
                      "utf-8"
                  )
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Already-running message sent."
          )
          PY


      # ============================================================
      # LANZAR PIPELINE
      # ============================================================

      - name: Launch VOD pipeline
        id: launch_pipeline
        if: |
          steps.start_check.outputs.start == 'true' &&
          steps.pipeline_status.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Launching VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: Could not launch VOD pipeline."

            echo "$RESPONSE"

            exit 1
          fi

          echo "VOD pipeline launched successfully."


      # ============================================================
      # CONFIRMAR INICIO
      # ============================================================

      - name: Notify pipeline started
        if: steps.launch_pipeline.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          text = (
              "🚀 Procesamiento iniciado.\n\n"
              "El Proyecto 2 comenzará a descargar "
              "y analizar el último VOD.\n\n"
              "Te avisaré cuando termine."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:

              data = json.loads(
                  response.read().decode(
                      "utf-8"
                  )
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Pipeline-start notification sent."
          )
          PY