name: Telegram Listener

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  telegram-listener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VOD pipeline status
        id: pipeline_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Checking VOD pipeline status"
          echo "========================================="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?per_page=20")

          echo "$RESPONSE" > workflow_runs.json

          RUNNING=$(python - <<'PY'
          import json

          with open("workflow_runs.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          running_states = {
              "queued",
              "in_progress",
              "waiting",
              "requested",
              "pending",
          }

          for run in data.get("workflow_runs", []):
              if run.get("status") in running_states:
                  print("true")
                  break
          else:
              print("false")
          PY
          )

          echo "Pipeline running: $RUNNING"

          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"

      - name: Get Telegram updates
        id: telegram_updates
        if: steps.pipeline_status.outputs.running == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Checking Telegram"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          allowed_chat_id = str(os.environ["TELEGRAM_CHAT_ID"])

          params = {
              "timeout": "5",
              "allowed_updates": json.dumps(["message"]),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Telegram request failed: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram API returned an error."
              )
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])

          print(
              f"Telegram updates received: {len(updates)}"
          )

          start_update = None

          for update in updates:
              message = update.get("message")

              if not message:
                  continue

              chat = message.get("chat", {})

              chat_id = str(
                  chat.get("id", "")
              )

              if chat_id != allowed_chat_id:
                  continue

              text = message.get(
                  "text",
                  ""
              ).strip()

              print(
                  f"Authorized Telegram message: "
                  f"update_id={update.get('update_id')} "
                  f"text={text!r}"
              )

              if (
                  text == "/start"
                  or text.startswith("/start@")
              ):
                  start_update = update

          if start_update is None:
              print()
              print("No /start command found.")

              with open(
                  "telegram_start_update_id.txt",
                  "w",
                  encoding="utf-8",
              ) as file:
                  file.write("")

              raise SystemExit(0)

          update_id = int(
              start_update["update_id"]
          )

          print()
          print(
              "========================================="
          )
          print(
              "AUTHORIZED /start DETECTED"
          )
          print(
              "========================================="
          )
          print(
              f"Telegram update ID: {update_id}"
          )

          with open(
              "telegram_start_update_id.txt",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(
                  str(update_id)
              )

          print(
              "The /start command will be acknowledged "
              "after GitHub accepts the pipeline."
          )
          PY

      - name: Launch VOD pipeline
        id: launch_pipeline
        if: |
          steps.pipeline_status.outputs.running == 'false' &&
          steps.telegram_updates.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f telegram_start_update_id.txt ]; then
            echo "No Telegram update information found."
            exit 0
          fi

          UPDATE_ID=$(cat telegram_start_update_id.txt)

          if [ -z "$UPDATE_ID" ]; then
            echo "No /start command to process."
            exit 0
          fi

          echo "========================================="
          echo "Launching VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: GitHub did not accept the workflow dispatch."
            echo "$BODY"
            exit 1
          fi

          echo
          echo "VOD pipeline successfully launched."
          echo "launched=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge Telegram update
        if: steps.launch_pipeline.outputs.launched == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ ! -f telegram_start_update_id.txt ]; then
            echo "No Telegram update ID found."
            exit 0
          fi

          UPDATE_ID=$(cat telegram_start_update_id.txt)

          if [ -z "$UPDATE_ID" ]; then
            echo "No Telegram update ID to acknowledge."
            exit 0
          fi

          OFFSET=$((UPDATE_ID + 1))

          echo "========================================="
          echo "Acknowledging Telegram update"
          echo "========================================="

          echo "Processed update ID: $UPDATE_ID"
          echo "New Telegram offset: $OFFSET"

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          offset = os.environ["TELEGRAM_OFFSET"]

          params = {
              "offset": offset,
              "allowed_updates": json.dumps(["message"]),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Could not acknowledge Telegram update: "
                  f"{exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram returned an error while "
                  "acknowledging the update."
              )
              print(data)
              raise SystemExit(1)

          print(
              "Telegram update acknowledged successfully."
          )
          PY

      - name: Send launch confirmation
        if: steps.launch_pipeline.outputs.launched == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Sending Telegram confirmation"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🚀 Procesamiento iniciado.\n\n"
              "He recibido tu /start y he iniciado "
              "el procesamiento del último VOD.\n\n"
              "Cuando los clips estén listos, "
              "te los enviaré aquí para aprobarlos o rechazarlos."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Could not send Telegram confirmation: "
                  f"{exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram returned an error."
              )
              print(data)
              raise SystemExit(1)

          print(
              "Telegram confirmation sent successfully."
          )
          PY

      - name: Listener summary
        run: |
          echo "========================================="
          echo "Telegram listener completed."
          echo "========================================="

          if [ "${{ steps.launch_pipeline.outputs.launched }}" = "true" ]; then
            echo "Result: VOD pipeline launched."
          elif [ "${{ steps.pipeline_status.outputs.running }}" = "true" ]; then
            echo "Result: VOD pipeline already running."
          else
            echo "Result: No /start command found."
          fi

          echo "========================================="
