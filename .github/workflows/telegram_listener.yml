name: Telegram Listener

on:
  schedule:
    # Comprueba Telegram cada 5 minutos.
    - cron: "*/5 * * * *"

  # Permite ejecutar el listener manualmente desde GitHub.
  workflow_dispatch:

permissions:
  # Permite consultar y lanzar workflows.
  actions: write

  # Necesario para checkout.
  contents: read

concurrency:
  # Impide que dos listeners se ejecuten al mismo tiempo.
  group: telegram-listener
  cancel-in-progress: false

jobs:
  telegram-listener:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # COMPROBAR SI EL PROYECTO 1 YA ESTÁ EJECUTÁNDOSE
      # ============================================================

      - name: Check VOD pipeline status
        id: pipeline_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Checking VOD pipeline status"
          echo "========================================="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?per_page=20")

          echo "$RESPONSE" > workflow_runs.json

          python - <<'PY'
          import json

          with open(
              "workflow_runs.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          running_states = {
              "queued",
              "in_progress",
              "waiting",
              "requested",
              "pending",
          }

          running = False

          for run in data.get(
              "workflow_runs",
              [],
          ):
              if run.get("status") in running_states:
                  running = True
                  break

          with open(
              "pipeline_running.txt",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(
                  "true" if running else "false"
              )

          print(
              f"Pipeline running: {running}"
          )
          PY

          RUNNING=$(cat pipeline_running.txt)

          echo "Pipeline running: $RUNNING"

          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"


      # ============================================================
      # LEER TELEGRAM
      # ============================================================

      - name: Get Telegram updates
        id: telegram_updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Checking Telegram"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          allowed_chat_id = str(
              os.environ["TELEGRAM_CHAT_ID"]
          )

          params = {
              "timeout": "5",
              "allowed_updates": json.dumps(
                  ["message"]
              ),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Telegram request failed: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram API returned an error."
              )
              print(data)
              raise SystemExit(1)

          updates = data.get(
              "result",
              [],
          )

          print(
              f"Telegram updates received: "
              f"{len(updates)}"
          )

          command_update = None

          # Procesamos el último comando válido recibido.
          for update in updates:
              message = update.get("message")

              if not message:
                  continue

              chat = message.get(
                  "chat",
                  {},
              )

              chat_id = str(
                  chat.get(
                      "id",
                      "",
                  )
              )

              # Solo aceptamos mensajes del chat autorizado.
              if chat_id != allowed_chat_id:
                  continue

              text = message.get(
                  "text",
                  "",
              ).strip()

              update_id = update.get(
                  "update_id"
              )

              print(
                  f"Authorized Telegram message: "
                  f"update_id={update_id} "
                  f"text={text!r}"
              )

              if (
                  text == "/start"
                  or text.startswith("/start@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "start",
                  }

              elif (
                  text == "/estado"
                  or text.startswith("/estado@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "estado",
                  }

              elif (
                  text == "/help"
                  or text.startswith("/help@")
              ):
                  command_update = {
                      "update_id": update_id,
                      "command": "help",
                  }

          if command_update is None:
              print("No supported command found.")

              with open(
                  "telegram_command.json",
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      {},
                      file,
                  )

              exit(0)

          print()
          print(
              "========================================="
          )
          print(
              "TELEGRAM COMMAND DETECTED"
          )
          print(
              "========================================="
          )

          print(
              f"Command: "
              f"{command_update['command']}"
          )

          print(
              f"Update ID: "
              f"{command_update['update_id']}"
          )

          with open(
              "telegram_command.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  command_update,
                  file,
                  indent=2,
              )
          PY


      # ============================================================
      # /HELP
      # ============================================================

      - name: Process /help
        if: steps.telegram_updates.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" != "help" ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "📖 Comandos disponibles:\n\n"
              "/start → Inicia un nuevo procesamiento.\n"
              "/estado → Consulta el estado del procesamiento.\n"
              "/help → Muestra los comandos disponibles."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print("Help message sent.")
          PY


      # ============================================================
      # /ESTADO
      # ============================================================

      - name: Process /estado
        if: steps.telegram_updates.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" != "estado" ]; then
            exit 0
          fi

          echo "========================================="
          echo "Checking latest VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?per_page=1")

          echo "$RESPONSE" > latest_run.json

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open(
              "latest_run.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          runs = data.get(
              "workflow_runs",
              [],
          )

          if not runs:
              status_text = (
                  "⚪ Sin proceso en curso."
              )

          else:
              run = runs[0]

              status = run.get(
                  "status"
              )

              conclusion = run.get(
                  "conclusion"
              )

              if status in {
                  "queued",
                  "in_progress",
                  "waiting",
                  "requested",
                  "pending",
              }:
                  status_text = (
                      "🟢 Procesando.\n\n"
                      "El Proyecto 1 está "
                      "trabajando en el último VOD."
                  )

              elif conclusion == "success":
                  status_text = (
                      "⚪ Sin proceso en curso.\n\n"
                      "El último procesamiento "
                      "terminó correctamente."
                  )

              elif conclusion == "failure":
                  status_text = (
                      "❌ Fallo.\n\n"
                      "El último procesamiento "
                      "ha terminado con errores."
                  )

              elif conclusion == "cancelled":
                  status_text = (
                      "❌ Procesamiento cancelado.\n\n"
                      "El último procesamiento "
                      "fue cancelado."
                  )

              else:
                  status_text = (
                      "⚪ Sin proceso en curso."
                  )

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": status_text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              telegram_result = json.loads(
                  response.read().decode("utf-8")
              )

          if not telegram_result.get("ok"):
              raise RuntimeError(
                  telegram_result
              )

          print(
              "Status sent to Telegram."
          )
          PY


      # ============================================================
      # COMPROBAR /START
      # ============================================================

      - name: Check /start command
        id: start_check
        if: steps.telegram_updates.outcome == 'success'
        run: |
          COMMAND=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              data.get(
                  "command",
                  "",
              )
          )
          PY
          )

          if [ "$COMMAND" = "start" ]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
          else
            echo "start=false" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # SI YA ESTÁ PROCESANDO
      # ============================================================

      - name: Inform that pipeline is already running
        if: |
          steps.start_check.outputs.start == 'true' &&
          steps.pipeline_status.outputs.running == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🟢 El Proyecto 1 ya está procesando un VOD.\n\n"
              "No se ha iniciado otro proceso."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Already-running message sent."
          )
          PY


      # ============================================================
      # LANZAR PROYECTO 1
      # ============================================================

      - name: Launch VOD pipeline
        id: launch_pipeline
        if: |
          steps.start_check.outputs.start == 'true' &&
          steps.pipeline_status.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Launching VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: GitHub did not accept the workflow dispatch."
            echo "$BODY"
            exit 1
          fi

          echo "VOD pipeline successfully launched."

          echo "launched=true" >> "$GITHUB_OUTPUT"


      # ============================================================
      # CONFIRMACIÓN DE /START
      # ============================================================

      - name: Send start confirmation
        if: steps.launch_pipeline.outputs.launched == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🚀 Procesamiento iniciado.\n\n"
              "He recibido tu /start y he iniciado "
              "el procesamiento del último VOD.\n\n"
              "Cuando los clips estén listos, "
              "te los enviaré aquí para aprobarlos "
              "o rechazarlos."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Start confirmation sent."
          )
          PY


      # ============================================================
      # RECONOCER EL MENSAJE EN TELEGRAM
      #
      # Telegram no vuelve a entregar el update una vez que
      # getUpdates recibe un offset superior al update_id.
      # ============================================================

      - name: Acknowledge Telegram update
        if: |
          steps.telegram_updates.outcome == 'success' &&
          hashFiles('telegram_command.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          UPDATE_ID=$(python - <<'PY'
          import json

          with open(
              "telegram_command.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          value = data.get(
              "update_id"
          )

          if value is not None:
              print(value)
          PY
          )

          if [ -z "$UPDATE_ID" ]; then
            echo "No update ID to acknowledge."
            exit 0
          fi

          OFFSET=$((UPDATE_ID + 1))

          echo "========================================="
          echo "Acknowledging Telegram update"
          echo "========================================="

          echo "Update ID: $UPDATE_ID"
          echo "Offset: $OFFSET"

          export TELEGRAM_OFFSET="$OFFSET"

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          offset = os.environ[
              "TELEGRAM_OFFSET"
          ]

          params = {
              "offset": offset,
              "allowed_updates": json.dumps(
                  ["message"]
              ),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Telegram update acknowledged."
          )
          PY


      # ============================================================
      # RESUMEN
      # ============================================================

      - name: Listener summary
        run: |
          echo "========================================="
          echo "Telegram listener completed."
          echo "========================================="

          if [ "${{ steps.launch_pipeline.outputs.launched }}" = "true" ]; then
            echo "Result: VOD pipeline launched."
          elif [ "${{ steps.pipeline_status.outputs.running }}" = "true" ]; then
            echo "Result: VOD pipeline already running."
          else
            echo "Result: Telegram command processed."
          fi

          echo "========================================="
