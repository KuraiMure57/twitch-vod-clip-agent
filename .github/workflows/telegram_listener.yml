name: Telegram Listener

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  telegram-listener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for running VOD pipeline
        id: check_pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Checking running VOD pipelines"
          echo "========================================="

          QUEUED_RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?status=queued&per_page=20")

          IN_PROGRESS_RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?status=in_progress&per_page=20")

          RUN_COUNT=$(python - <<'PY'
          import json
          import os

          queued_raw = os.environ["QUEUED_RUNS"]
          in_progress_raw = os.environ["IN_PROGRESS_RUNS"]

          queued = json.loads(queued_raw)
          in_progress = json.loads(in_progress_raw)

          current_run_id = int(os.environ["GITHUB_RUN_ID"])

          runs = []

          for data in (queued, in_progress):
              for run in data.get("workflow_runs", []):
                  if run.get("id") != current_run_id:
                      runs.append(run)

          unique_ids = {
              run.get("id")
              for run in runs
              if run.get("id") is not None
          }

          print(len(unique_ids))
          PY
          )

          echo "Running/queued pipeline count: $RUN_COUNT"

          if [ "$RUN_COUNT" -gt 0 ]; then
            echo "A VOD pipeline is already running or queued."
            echo "Telegram messages will NOT be consumed."
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "No VOD pipeline is currently running."
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUED_RUNS: ""
          IN_PROGRESS_RUNS: ""

      - name: Get Telegram updates
        if: steps.check_pipeline.outputs.running == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Checking Telegram"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          allowed_chat_id = str(os.environ["TELEGRAM_CHAT_ID"])

          params = {
              "timeout": "5",
              "allowed_updates": json.dumps(["message"]),
          }

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Telegram request failed: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram API returned an error."
              )
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])

          print(
              f"Telegram updates received: "
              f"{len(updates)}"
          )

          start_update = None

          for update in updates:
              message = update.get("message")

              if not message:
                  continue

              chat = message.get("chat", {})
              chat_id = str(
                  chat.get("id", "")
              )

              if chat_id != allowed_chat_id:
                  continue

              text = message.get(
                  "text",
                  ""
              ).strip()

              print(
                  f"Authorized Telegram message: "
                  f"update_id={update.get('update_id')} "
                  f"text={text!r}"
              )

              if (
                  text == "/start"
                  or text.startswith("/start@")
              ):
                  start_update = update

          if start_update is None:
              print("No /start command found.")
              raise SystemExit(0)

          update_id = int(
              start_update["update_id"]
          )

          print()
          print(
              "========================================="
          )
          print(
              "AUTHORIZED /start DETECTED"
          )
          print(
              "========================================="
          )
          print(
              f"Telegram update ID: {update_id}"
          )

          output_file = "telegram_start_update.json"

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  start_update,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )

          with open(
              "telegram_start_update_id.txt",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(
                  str(update_id)
              )

          print(
              f"Saved: {output_file}"
          )

          print(
              "The /start will be acknowledged "
              "after the VOD workflow is successfully launched."
          )
          PY

      - name: Launch VOD pipeline
        id: launch_pipeline
        if: steps.check_pipeline.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f telegram_start_update.json ]; then
            echo "No /start command to process."
            exit 0
          fi

          echo "========================================="
          echo "Launching VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: GitHub did not accept the workflow dispatch."
            echo "$BODY"
            exit 1
          fi

          echo "VOD pipeline successfully launched."
          echo "launched=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge processed Telegram update
        if: steps.launch_pipeline.outputs.launched == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ ! -f telegram_start_update_id.txt ]; then
            echo "No Telegram update ID found."
            exit 0
          fi

          UPDATE_ID=$(cat telegram_start_update_id.txt)

          echo "========================================="
          echo "Acknowledging Telegram update"
          echo "========================================="

          OFFSET=$((UPDATE_ID + 1))

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          offset = os.environ["TELEGRAM_OFFSET"]

          params = urllib.parse.urlencode(
              {
                  "offset": offset,
                  "allowed_updates": json.dumps(
                      ["message"]
                  ),
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates?"
              f"{params}"
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Could not acknowledge "
                  f"Telegram update: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram returned an error "
                  "while acknowledging the update."
              )
              print(data)
              raise SystemExit(1)

          print(
              f"Telegram updates acknowledged "
              f"through offset {offset}."
          )
          PY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OFFSET: ${{ steps.telegram_offset.outputs.offset }}

      - name: Confirm launch in Telegram
        if: steps.launch_pipeline.outputs.launched == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🚀 He recibido tu /start.\n\n"
              "He iniciado el procesamiento de tu último VOD.\n\n"
              "Te enviaré los clips por aquí cuando estén "
              "listos para revisar."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage"
              f"?{params}"
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  f"ERROR: Could not send Telegram "
                  f"confirmation: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(data)
              raise SystemExit(1)

          print(
              "Telegram confirmation sent."
          )
          PY

      - name: Listener summary
        run: |
          echo "========================================="
          echo "Telegram listener completed."
          echo "========================================="
