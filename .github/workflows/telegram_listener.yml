name: Telegram Listener

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  telegram-listener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for running VOD pipeline
        id: check_pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================="
          echo "Checking running VOD pipelines"
          echo "========================================="

          RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?status=in_progress&per_page=20")

          RUN_COUNT=$(echo "$RUNS" | python -c "
          import json
          import sys

          data = json.load(sys.stdin)

          runs = [
              run
              for run in data.get('workflow_runs', [])
              if run.get('id') != ${GITHUB_RUN_ID}
          ]

          print(len(runs))
          ")

          echo "Running pipeline count: $RUN_COUNT"

          if [ "$RUN_COUNT" -gt 0 ]; then
            echo "A VOD pipeline is already running."
            echo "The Telegram listener will not consume Telegram messages."
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "No VOD pipeline is currently running."
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Telegram updates
        if: steps.check_pipeline.outputs.running == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Checking Telegram"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          allowed_chat_id = str(os.environ["TELEGRAM_CHAT_ID"])

          url = (
              f"https://api.telegram.org/bot{bot_token}/getUpdates"
              "?timeout=5"
              "&allowed_updates="
              + urllib.parse.quote(
                  json.dumps(["message"])
              )
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(f"ERROR: Telegram request failed: {exc}")
              raise SystemExit(1)

          if not data.get("ok"):
              print("ERROR: Telegram API returned an error.")
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])

          print(f"Telegram updates received: {len(updates)}")

          start_update = None

          for update in updates:
              message = update.get("message")

              if not message:
                  continue

              chat = message.get("chat", {})
              chat_id = str(chat.get("id", ""))

              if chat_id != allowed_chat_id:
                  continue

              text = message.get("text", "")
              text = text.strip()

              print(
                  f"Authorized Telegram message: "
                  f"update_id={update.get('update_id')} "
                  f"text={text!r}"
              )

              if text == "/start" or text.startswith("/start@"):
                  start_update = update

          if start_update is None:
              print("No /start command found.")
              raise SystemExit(0)

          update_id = start_update["update_id"]

          print()
          print("=========================================")
          print("AUTHORIZED /start DETECTED")
          print("=========================================")
          print(f"Telegram update ID: {update_id}")

          output_file = "telegram_start_update.json"

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  start_update,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )

          print(f"Saved: {output_file}")
          PY

      - name: Launch VOD pipeline
        if: steps.check_pipeline.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f telegram_start_update.json ]; then
            echo "No /start command to process."
            exit 0
          fi

          echo "========================================="
          echo "Launching VOD pipeline"
          echo "========================================="

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: GitHub did not accept the workflow dispatch."
            echo "$BODY"
            exit 1
          fi

          echo "VOD pipeline successfully launched."

      - name: Confirm launch in Telegram
        if: success() && steps.check_pipeline.outputs.running == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f telegram_start_update.json ]; then
            echo "No /start command was processed."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🚀 He recibido tu /start.\n\n"
              "He iniciado el procesamiento de tu último VOD.\n\n"
              "Te enviaré los clips por aquí cuando estén "
              "listos para revisar."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage"
              f"?{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              print(data)
              raise SystemExit(1)

          print("Telegram confirmation sent.")
          PY

      - name: Listener summary
        run: |
          echo "========================================="
          echo "Telegram listener completed."
          echo "========================================="
