name: Complete VOD Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-vod-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo
          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is installed correctly."
          else
            echo "FFmpeg is NOT installed."
            exit 1
          fi

      - name: Test FFprobe
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "FFprobe is installed correctly."
          else
            echo "FFprobe is NOT installed."
            exit 1
          fi

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py

      - name: Discover latest Twitch VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py

      - name: Download complete VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FORCE_VOD_TEST_DOWNLOAD: "true"
        run: |
          python src/twitch_vod_downloader.py

      - name: Show processed VOD state
        run: |
          echo "========================================="
          echo "Current processed VOD state:"
          echo "========================================="

          if [ -f data/processed_vods.json ]; then
            cat data/processed_vods.json
          else
            echo "No processed VOD state file found."
          fi

          echo
          echo "========================================="

      - name: Check complete VOD
        run: |
          echo "========================================="
          echo "Available complete VOD files:"
          echo "========================================="

          if [ ! -d data/vods ]; then
            echo "ERROR: data/vods directory does not exist."
            exit 1
          fi

          find data/vods -maxdepth 1 -type f -print

          VOD_FILE_COUNT=$(find data/vods -maxdepth 1 -type f -name "*.mp4" | wc -l)

          echo
          echo "MP4 files found: $VOD_FILE_COUNT"

          if [ "$VOD_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No complete VOD MP4 was downloaded."
            exit 1
          fi

          echo
          echo "Complete VOD download verified."

      - name: Inspect complete VOD
        run: |
          echo "========================================="
          echo "Complete VOD information:"
          echo "========================================="

          for file in data/vods/*.mp4; do
            echo "File: $file"

            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$file"

            echo
          done

      - name: Run Whisper transcription
        run: |
          python src/whisper_transcriber.py

      - name: Show Whisper transcription
        run: |
          echo "========================================="
          echo "Whisper transcription:"
          echo "========================================="

          if [ ! -f data/transcriptions/2846005700_test.json ]; then
            echo "ERROR: Whisper transcription output not found."
            exit 1
          fi

          cat data/transcriptions/2846005700_test.json

          echo
          echo "========================================="

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/gemini_analyzer.py

      - name: Show Gemini candidates
        run: |
          echo "========================================="
          echo "Gemini candidates:"
          echo "========================================="

          if [ ! -f data/analysis/2846005700_candidates.json ]; then
            echo "ERROR: Gemini analysis output not found."
            exit 1
          fi

          cat data/analysis/2846005700_candidates.json

          echo
          echo "========================================="

      - name: Generate clips
        run: |
          python src/clip_generator.py

      - name: Show generated clips
        run: |
          echo "========================================="
          echo "Generated clips:"
          echo "========================================="

          if [ ! -d data/clips ]; then
            echo "ERROR: data/clips directory does not exist."
            exit 1
          fi

          find data/clips -maxdepth 1 -type f -print

          CLIP_COUNT=$(find data/clips -maxdepth 1 -type f -name "*.mp4" | wc -l)

          echo
          echo "MP4 clips found: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -eq 0 ]; then
            echo "ERROR: No clips were generated."
            exit 1
          fi

          echo
          echo "Clip generation verified."

      - name: Inspect generated clips
        run: |
          echo "========================================="
          echo "Generated clip information:"
          echo "========================================="

          for file in data/clips/*.mp4; do
            echo "-----------------------------------------"
            echo "File: $file"

            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$file"
          done

          echo
          echo "========================================="

      - name: Show clips manifest
        run: |
          echo "========================================="
          echo "Clips manifest:"
          echo "========================================="

          if [ ! -f data/clips/clips_manifest.json ]; then
            echo "ERROR: Clips manifest was not generated."
            exit 1
          fi

          cat data/clips/clips_manifest.json

          echo
          echo "========================================="

      - name: Upload Whisper transcription
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcription-complete-test
          path: data/transcriptions/*.json
          if-no-files-found: error

      - name: Upload Gemini analysis
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-complete-test
          path: data/analysis/*.json
          if-no-files-found: error

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips-test
          path: data/clips/*.mp4
          if-no-files-found: error

      - name: Upload clips manifest
        uses: actions/upload-artifact@v4
        with:
          name: clips-manifest-test
          path: data/clips/clips_manifest.json
          if-no-files-found: error

      - name: Complete VOD pipeline test completed
        run: |
          echo "========================================="
          echo "Complete VOD pipeline test completed."
          echo "========================================="
          echo "Python: OK"
          echo "FFmpeg: OK"
          echo "FFprobe: OK"
          echo "Git: OK"
          echo "Whisper: OK"
          echo "Gemini SDK: OK"
          echo "Twitch authentication: OK"
          echo "Twitch VOD discovery: OK"
          echo "Complete VOD download: OK"
          echo "Whisper transcription: OK"
          echo "Gemini analysis: OK"
          echo "Clip generation: OK"
          echo "========================================="
