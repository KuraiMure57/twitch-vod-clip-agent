name: Initial Environment Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo
          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is installed correctly."
          else
            echo "FFmpeg is NOT installed."
            exit 1
          fi

      - name: Test FFprobe
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "FFprobe is installed correctly."
          else
            echo "FFprobe is NOT installed."
            exit 1
          fi

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py

      - name: Test Twitch VOD discovery
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py

      - name: Download complete VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FORCE_VOD_DOWNLOAD: "true"
        run: |
          python src/twitch_vod_downloader.py

      - name: Show downloaded VOD
        run: |
          echo "Available complete VOD files:"

          if [ ! -d "data/vods" ]; then
            echo "ERROR: data/vods directory does not exist."
            exit 1
          fi

          find data/vods \
            -maxdepth 1 \
            -type f \
            -print

          if ! compgen -G "data/vods/*.mp4" > /dev/null; then
            echo "ERROR: No complete VOD MP4 was downloaded."
            exit 1
          fi

      - name: Run Whisper transcription
        run: |
          python src/whisper_transcriber.py

      - name: Show transcription
        run: |
          echo "========================================="
          echo "Whisper transcription:"
          echo "========================================="

          find data/transcriptions \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print

          echo

          cat data/transcriptions/*.json

          echo
          echo "========================================="

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/gemini_analyzer.py

      - name: Show Gemini candidates
        run: |
          echo "========================================="
          echo "Gemini candidates:"
          echo "========================================="

          find data/analysis \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print

          echo

          cat data/analysis/*.json

          echo
          echo "========================================="

      - name: Upload Whisper transcription
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcription-test
          path: data/transcriptions/*.json
          if-no-files-found: error

      - name: Upload Gemini analysis
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-test
          path: data/analysis/*.json
          if-no-files-found: error

      - name: Environment test completed
        run: |
          echo "========================================="
          echo "Complete VOD pipeline test completed."
          echo "Python: OK"
          echo "FFmpeg: OK"
          echo "FFprobe: OK"
          echo "Git: OK"
          echo "Whisper: OK"
          echo "Gemini SDK: OK"
          echo "Twitch authentication: OK"
          echo "Twitch VOD discovery: OK"
          echo "Complete VOD download: OK"
          echo "Whisper transcription: OK"
          echo "Gemini analysis: OK"
          echo "========================================="
