name: Initial Environment Test

on:
  workflow_dispatch:

jobs:
  test-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo
          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is installed correctly."
          else
            echo "FFmpeg is NOT installed."
            exit 1
          fi

      - name: Test FFprobe
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "FFprobe is installed correctly."
          else
            echo "FFprobe is NOT installed."
            exit 1
          fi

      - name: Environment test completed
        run: |
          echo "========================================="
          echo "Initial environment test completed."
          echo "Python: OK"
          echo "FFmpeg: OK"
          echo "FFprobe: OK"
          echo "Git: OK"
          echo "========================================="
