      - name: Upload pipeline summary
        if: always()
        run: |
          echo "========================================="
          echo "PIPELINE SUMMARY"
          echo "========================================="

          echo "VOD_ID: ${VOD_ID:-unknown}"

          if [ -d "data/clips/${VOD_ID}" ]; then
            CLIP_COUNT=$(find "data/clips/${VOD_ID}" \
              -maxdepth 1 \
              -type f \
              -name "*.mp4" \
              | wc -l)

            echo "Generated clips: $CLIP_COUNT"
          else
            echo "Generated clips: 0"
          fi

          if [ -d "data/telegram_approved" ]; then
            APPROVAL_COUNT=$(find data/telegram_approved \
              -maxdepth 1 \
              -type f \
              -name "*_approved.json" \
              | wc -l)

            echo "Approval JSON files: $APPROVAL_COUNT"
          else
            echo "Approval JSON files: 0"
          fi

          echo "========================================="

      - name: Notify Telegram pipeline failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get(
              "TELEGRAM_BOT_TOKEN"
          )

          chat_id = os.environ.get(
              "TELEGRAM_CHAT_ID"
          )

          if not token or not chat_id:
              print(
                  "Telegram failure notification skipped: "
                  "credentials not configured."
              )
              raise SystemExit(0)

          vod_id = os.environ.get(
              "VOD_ID",
              "unknown",
          )

          text = (
              "❌ Error en el pipeline de VOD\n\n"
              f"VOD: {vod_id}\n"
              "El procesamiento ha fallado.\n\n"
              "Revisa los logs de GitHub Actions."
          )

          data = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          ).encode("utf-8")

          url = (
              "https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  print(
                      "Telegram failure notification sent: "
                      f"HTTP {response.status}"
                  )

          except Exception as exc:
              print(
                  "Telegram failure notification failed: "
                  f"{exc}"
              )
          PY