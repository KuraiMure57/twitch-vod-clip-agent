name: Complete VOD Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-vod-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo

          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || exit 1
          echo "FFmpeg is installed correctly."

      - name: Test FFprobe
        run: |
          command -v ffprobe >/dev/null 2>&1 || exit 1
          echo "FFprobe is installed correctly."

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py

      - name: Discover latest Twitch VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py

      - name: Download complete VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FORCE_VOD_DOWNLOAD: "true"
        run: |
          python src/twitch_vod_downloader.py

      - name: Show processed VOD state
        run: |
          echo "========================================="
          echo "Current processed VOD state:"
          echo "========================================="

          if [ -f data/processed_vods.json ]; then
            cat data/processed_vods.json
          else
            echo "No processed VOD state file found."
          fi

          echo
          echo "========================================="

      - name: Check complete VOD
        run: |
          echo "========================================="
          echo "Available complete VOD files:"
          echo "========================================="

          if [ ! -d data/vods ]; then
            echo "ERROR: data/vods directory does not exist."
            exit 1
          fi

          VOD_FILE_COUNT=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 files found: $VOD_FILE_COUNT"

          if [ "$VOD_FILE_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one complete VOD MP4."
            exit 1
          fi

          VOD_FILE=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4")

          VOD_ID=$(basename "$VOD_FILE" .mp4)

          echo "VOD file: $VOD_FILE"
          echo "VOD ID: $VOD_ID"

          echo "VOD_ID=$VOD_ID" >> "$GITHUB_ENV"

          echo
          echo "Complete VOD download verified."

      - name: Inspect complete VOD
        run: |
          echo "========================================="
          echo "Complete VOD inspection:"
          echo "========================================="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "data/vods/${VOD_ID}.mp4"

      - name: Run Whisper transcription
        run: |
          python src/whisper_transcriber.py

      - name: Check Whisper transcription
        run: |
          echo "========================================="
          echo "Whisper transcription:"
          echo "========================================="

          TRANSCRIPTION_FILE="data/transcriptions/${VOD_ID}.json"

          if [ ! -f "$TRANSCRIPTION_FILE" ]; then
            echo "ERROR: Expected Whisper output not found:"
            echo "$TRANSCRIPTION_FILE"
            exit 1
          fi

          cat "$TRANSCRIPTION_FILE"

          echo
          echo "Whisper transcription verified."

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/gemini_analyzer.py

      - name: Check Gemini analysis
        run: |
          echo "========================================="
          echo "Gemini candidates:"
          echo "========================================="

          ANALYSIS_FILE="data/analysis/${VOD_ID}_candidates.json"

          if [ ! -f "$ANALYSIS_FILE" ]; then
            echo "ERROR: Expected Gemini output not found:"
            echo "$ANALYSIS_FILE"
            exit 1
          fi

          cat "$ANALYSIS_FILE"

          echo
          echo "Gemini analysis verified."

      - name: Filter candidates
        run: |
          python src/candidate_filter.py

      - name: Check filtered candidates
        run: |
          echo "========================================="
          echo "Filtered candidates:"
          echo "========================================="

          FILTERED_FILE="data/filtered_candidates/${VOD_ID}_selected.json"

          if [ ! -f "$FILTERED_FILE" ]; then
            echo "ERROR: Expected filtered candidates output not found:"
            echo "$FILTERED_FILE"
            exit 1
          fi

          cat "$FILTERED_FILE"

          echo
          echo "Candidate filtering verified."

      - name: Generate clips
        run: |
          python src/clip_generator.py

      - name: Show generated clips
        run: |
          echo "========================================="
          echo "Generated clips:"
          echo "========================================="

          CLIP_DIR="data/clips/${VOD_ID}"

          if [ ! -d "$CLIP_DIR" ]; then
            echo "ERROR: Clip directory does not exist:"
            echo "$CLIP_DIR"
            exit 1
          fi

          find "$CLIP_DIR" -type f -print

          CLIP_COUNT=$(find "$CLIP_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo
          echo "MP4 clips found: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -eq 0 ]; then
            echo "No clips were generated."
            echo "This is valid when no candidates pass the filter."
          else
            echo
            echo "Clip generation verified."
          fi

      - name: Inspect generated clips
        run: |
          CLIP_DIR="data/clips/${VOD_ID}"

          for file in "$CLIP_DIR"/*.mp4; do
            if [ -f "$file" ]; then
              echo "========================================="
              echo "Clip: $file"
              echo "========================================="

              ffprobe \
                -v error \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$file"
            fi
          done

      - name: Show clips manifest
        run: |
          echo "========================================="
          echo "Clips manifest:"
          echo "========================================="

          MANIFEST_FILE="data/clips/${VOD_ID}/clips_manifest.json"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Clips manifest was not generated:"
            echo "$MANIFEST_FILE"
            exit 1
          fi

          cat "$MANIFEST_FILE"

          echo
          echo "Clips manifest verified."

      - name: Test Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram configuration test:"
          echo "========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is not configured."
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: configured"
          echo "TELEGRAM_CHAT_ID: configured"

      - name: Send clips to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram clip approval:"
          echo "========================================="

          python src/telegram_approval.py

          echo
          echo "Telegram approval process completed."

      - name: Check Telegram approval result
        run: |
          echo "========================================="
          echo "Telegram approval result:"
          echo "========================================="

          APPROVAL_DIR="data/telegram_approved"
          APPROVAL_FILES=$(find "$APPROVAL_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*_approved.json" \
            2>/dev/null || true)

          if [ -n "$APPROVAL_FILES" ]; then
            echo "✅ Archivos de aprobación encontrados:"
            echo "$APPROVAL_FILES"

            echo "-----------------------------------------"

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                echo "Archivo: $file"
                cat "$file"
                echo
                echo "-----------------------------------------"
              fi
            done <<< "$APPROVAL_FILES"

            echo
            echo "Telegram approval result verified."
          else
            echo "ℹ️ Todavía no existe ningún archivo *_approved.json."
            echo
            echo "Los clips han sido enviados a Telegram."
            echo "El archivo de aprobación se generará cuando"
            echo "se procesen las decisiones de APROBAR/RECHAZAR."
            echo
            echo "El workflow continuará sin considerar esto un error."
          fi

      - name: Upload Whisper transcription
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcription-complete-test
          path: data/transcriptions/${{ env.VOD_ID }}.json
          if-no-files-found: error

      - name: Upload Gemini analysis
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-complete-test
          path: data/analysis/${{ env.VOD_ID }}_candidates.json
          if-no-files-found: error

      - name: Upload filtered candidates
        uses: actions/upload-artifact@v4
        with:
          name: filtered-candidates-test
          path: data/filtered_candidates/${{ env.VOD_ID }}_selected.json
          if-no-files-found: error

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips-test
          path: data/clips/${{ env.VOD_ID }}/*.mp4
          if-no-files-found: warn

      - name: Upload clips manifest
        uses: actions/upload-artifact@v4
        with:
          name: clips-manifest-test
          path: data/clips/${{ env.VOD_ID }}/clips_manifest.json
          if-no-files-found: error

      - name: Upload Telegram approval result
        uses: actions/upload-artifact@v4
        with:
          name: telegram-approval-test
          path: data/telegram_approved/*_approved.json
          if-no-files-found: warn

      # ============================================================
      # PUENTE AUTOMÁTICO HACIA PROYECTO 1
      # ============================================================

      - name: Trigger Twitch TikTok Agent for Approved Clips
        if: success()
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          echo "========================================="
          echo "🤖 PUENTE AUTOMÁTICO AL PROYECTO 1"
          echo "========================================="

          if [ -z "$CROSS_REPO_TOKEN" ]; then
            echo "⚠️ CROSS_REPO_TOKEN no está configurado."
            echo "El workflow continuará sin disparar el Proyecto 1."
            exit 0
          fi

          APPROVAL_FILES=$(find data/telegram_approved \
            -maxdepth 1 \
            -type f \
            -name "*_approved.json" \
            2>/dev/null || true)

          if [ -z "$APPROVAL_FILES" ]; then
            echo "ℹ️ No hay archivos de aprobación todavía."
            echo "No se dispara el Proyecto 1."
            exit 0
          fi

          echo "Archivos de aprobación encontrados:"
          echo "$APPROVAL_FILES"

          echo
          echo "Buscando IDs de los artefactos en GitHub..."

          RUN_ARTIFACTS=$(curl -fsSL \
            -H "Authorization: Bearer $CROSS_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")

          CLIPS_ART_ID=$(echo "$RUN_ARTIFACTS" | python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          print(
              next(
                  (
                      str(a["id"])
                      for a in data.get("artifacts", [])
                      if a.get("name") == "generated-clips-test"
                  ),
                  ""
              )
          )
          ')

          MANIFEST_ART_ID=$(echo "$RUN_ARTIFACTS" | python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          print(
              next(
                  (
                      str(a["id"])
                      for a in data.get("artifacts", [])
                      if a.get("name") == "clips-manifest-test"
                  ),
                  ""
              )
          )
          ')

          if [ -z "$CLIPS_ART_ID" ] || [ -z "$MANIFEST_ART_ID" ]; then
            echo "⚠️ No se pudieron encontrar los IDs de los artefactos."
            echo "No se dispara el Proyecto 1."
            exit 0
          fi

          echo "✅ ID de Clips Artifact: $CLIPS_ART_ID"
          echo "✅ ID de Manifest Artifact: $MANIFEST_ART_ID"

          python3 - <<PY
          import glob
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          clips_art_id = "$CLIPS_ART_ID"
          manifest_art_id = "$MANIFEST_ART_ID"
          token = os.environ["CROSS_REPO_TOKEN"]

          approval_files = glob.glob(
              "data/telegram_approved/*_approved.json"
          )

          if not approval_files:
              print(
                  "ℹ️ No se encontraron archivos de aprobación."
              )
              sys.exit(0)

          for approval_file in approval_files:
              with open(
                  approval_file,
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

              vod_id = data.get("vod_id")
              approved_clips = data.get(
                  "approved_clips",
                  [],
              )

              print()
              print(
                  f"Evaluating VOD: {vod_id} -> "
                  f"Found {len(approved_clips)} approved clips."
              )

              for clip in approved_clips:
                  clip_path = clip.get("file", "")

                  if not clip_path:
                      continue

                  clip_filename = os.path.basename(
                      clip_path
                  )

                  print(
                      f"🚀 Disparando Proyecto 1 para: "
                      f"{clip_filename}"
                  )

                  payload = {
                      "vod_id": vod_id,
                      "clip_filename": clip_filename,
                      "clips_artifact_id": clips_art_id,
                      "manifest_artifact_id": manifest_art_id,
                  }

                  request_data = json.dumps(
                      payload
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      "https://api.github.com/repos/"
                      "KuraiMure57/twitch-tiktok-agent/"
                      "dispatches",
                      data=request_data,
                      method="POST",
                      headers={
                          "Authorization": (
                              f"Bearer {token}"
                          ),
                          "Accept": (
                              "application/vnd.github+json"
                          ),
                          "Content-Type": (
                              "application/json"
                          ),
                          "X-GitHub-Api-Version": (
                              "2022-11-28"
                          ),
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=60,
                      ) as response:
                          status = response.status

                      if status == 204:
                          print(
                              f"✅ Proyecto 1 disparado "
                              f"correctamente para "
                              f"{clip_filename}"
                          )
                      else:
                          print(
                              f"⚠️ GitHub respondió con "
                              f"HTTP {status}"
                          )

                  except Exception as exc:
                      print(
                          f"❌ Error disparando Proyecto 1 "
                          f"para {clip_filename}: {exc}"
                      )

          print()
          print(
              "Proceso de puente al Proyecto 1 finalizado."
          )
          PY

      - name: Upload pipeline summary
        if: always()
        run: |
          echo "========================================="
          echo "PIPELINE SUMMARY"
          echo "========================================="
          echo "VOD_ID: ${VOD_ID:-unknown}"

          if [ -d "data/clips/${VOD_ID}" ]; then
            CLIP_COUNT=$(find "data/clips/${VOD_ID}" \
              -maxdepth 1 \
              -type f \
              -name "*.mp4" \
              | wc -l)

            echo "Generated clips: $CLIP_COUNT"
          else
            echo "Generated clips: 0"
          fi

          if [ -d "data/telegram_approved" ]; then
            APPROVAL_COUNT=$(find data/telegram_approved \
              -maxdepth 1 \
              -type f \
              -name "*_approved.json" \
              | wc -l)

            echo "Approval JSON files: $APPROVAL_COUNT"
          else
            echo "Approval JSON files: 0"
          fi

          echo "========================================="
   
      - name: Upload pipeline summary
        if: always()
        run: |
          # ... (contenido del resumen que ya tienes) ...

      - name: Notify Telegram pipeline failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get(
              "TELEGRAM_BOT_TOKEN"
          )
          chat_id = os.environ.get(
              "TELEGRAM_CHAT_ID"
          )

          if not token or not chat_id:
              print(
                  "Telegram failure notification skipped: "
                  "credentials not configured."
              )
              raise SystemExit(0)

          vod_id = os.environ.get(
              "VOD_ID",
              "unknown",
          )

          text = (
              "❌ Error en el pipeline de VOD\n\n"
              f"VOD: {vod_id}\n"
              "Revisa los logs de GitHub Actions."
          )

          data = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          ).encode("utf-8")

          url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  print(
                      f"Telegram failure notification "
                      f"sent: HTTP {response.status}"
                  )
          except Exception as exc:
              print(
                  f"Telegram failure notification "
                  f"failed: {exc}"
              )
          PY
          PY
