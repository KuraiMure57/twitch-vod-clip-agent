name: Initial Environment Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo
          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is installed correctly."
          else
            echo "FFmpeg is NOT installed."
            exit 1
          fi

      - name: Test FFprobe
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "FFprobe is installed correctly."
          else
            echo "FFprobe is NOT installed."
            exit 1
          fi

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py

      - name: Test Twitch VOD discovery
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py

      - name: Test VOD state and download
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vod_downloader.py

      - name: Show VOD state
        run: |
          echo "Current processed VOD state:"
          cat data/processed_vods.json

      - name: Commit processed VOD state
        run: |
          if git diff --quiet -- data/processed_vods.json; then
            echo "No VOD state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed_vods.json

          git commit \
            -m "Mark VOD as processed"

          git push

      - name: Upload downloaded VOD test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-vod-test
          path: data/vod_test/*.mp4
          if-no-files-found: error

      - name: Environment test completed
        run: |
          echo "========================================="
          echo "Initial environment test completed."
          echo "Python: OK"
          echo "FFmpeg: OK"
          echo "FFprobe: OK"
          echo "Git: OK"
          echo "Whisper: OK"
          echo "Gemini SDK: OK"
          echo "Twitch authentication: OK"
          echo "Twitch VOD discovery: OK"
          echo "VOD state detection: OK"
          echo "Twitch VOD download: OK"
          echo "VOD state persistence: OK"
          echo "========================================="
