name: Complete VOD Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-vod-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo

          echo "Ubuntu version:"
          lsb_release -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1

      - name: Show Git version
        run: git --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || exit 1
          echo "FFmpeg is installed correctly."

      - name: Test FFprobe
        run: |
          command -v ffprobe >/dev/null 2>&1 || exit 1
          echo "FFprobe is installed correctly."

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py

      - name: Discover latest Twitch VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py

      - name: Download complete VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FORCE_VOD_DOWNLOAD: "true"
        run: |
          python src/twitch_vod_downloader.py

      - name: Show processed VOD state
        run: |
          echo "========================================="
          echo "Current processed VOD state:"
          echo "========================================="

          if [ -f data/processed_vods.json ]; then
            cat data/processed_vods.json
          else
            echo "No processed VOD state file found."
          fi

          echo
          echo "========================================="

      - name: Check complete VOD
        run: |
          echo "========================================="
          echo "Available complete VOD files:"
          echo "========================================="

          if [ ! -d data/vods ]; then
            echo "ERROR: data/vods directory does not exist."
            exit 1
          fi

          VOD_FILE_COUNT=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 files found: $VOD_FILE_COUNT"

          if [ "$VOD_FILE_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one complete VOD MP4."
            exit 1
          fi

          VOD_FILE=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4")

          VOD_ID=$(basename "$VOD_FILE" .mp4)

          echo "VOD file: $VOD_FILE"
          echo "VOD ID: $VOD_ID"

          echo "VOD_ID=$VOD_ID" >> "$GITHUB_ENV"

          echo
          echo "Complete VOD download verified."

      - name: Inspect complete VOD
        run: |
          echo "========================================="
          echo "Complete VOD inspection:"
          echo "========================================="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "data/vods/${VOD_ID}.mp4"

      - name: Run Whisper transcription
        run: |
          python src/whisper_transcriber.py

      - name: Check Whisper transcription
        run: |
          echo "========================================="
          echo "Whisper transcription:"
          echo "========================================="

          TRANSCRIPTION_FILE="data/transcriptions/${VOD_ID}.json"

          if [ ! -f "$TRANSCRIPTION_FILE" ]; then
            echo "ERROR: Expected Whisper output not found:"
            echo "$TRANSCRIPTION_FILE"
            exit 1
          fi

          cat "$TRANSCRIPTION_FILE"

          echo
          echo "Whisper transcription verified."

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/gemini_analyzer.py

      - name: Check Gemini analysis
        run: |
          echo "========================================="
          echo "Gemini candidates:"
          echo "========================================="

          ANALYSIS_FILE="data/analysis/${VOD_ID}_candidates.json"

          if [ ! -f "$ANALYSIS_FILE" ]; then
            echo "ERROR: Expected Gemini output not found:"
            echo "$ANALYSIS_FILE"
            exit 1
          fi

          cat "$ANALYSIS_FILE"

          echo
          echo "Gemini analysis verified."

      - name: Filter candidates
        run: |
          python src/candidate_filter.py

      - name: Check filtered candidates
        run: |
          echo "========================================="
          echo "Filtered candidates:"
          echo "========================================="

          FILTERED_FILE="data/filtered_candidates/${VOD_ID}_selected.json"

          if [ ! -f "$FILTERED_FILE" ]; then
            echo "ERROR: Expected filtered candidates output not found:"
            echo "$FILTERED_FILE"
            exit 1
          fi

          cat "$FILTERED_FILE"

          echo
          echo "Candidate filtering verified."

      - name: Generate clips
        run: |
          python src/clip_generator.py

      - name: Show generated clips
        run: |
          echo "========================================="
          echo "Generated clips:"
          echo "========================================="

          CLIP_DIR="data/clips/${VOD_ID}"

          if [ ! -d "$CLIP_DIR" ]; then
            echo "ERROR: Clip directory does not exist:"
            echo "$CLIP_DIR"
            exit 1
          fi

          find "$CLIP_DIR" -type f -print

          CLIP_COUNT=$(find "$CLIP_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo
          echo "MP4 clips found: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -eq 0 ]; then
            echo "No clips were generated."
            echo "This is valid when no candidates pass the filter."
          else
            echo
            echo "Clip generation verified."
          fi

      - name: Inspect generated clips
        run: |
          CLIP_DIR="data/clips/${VOD_ID}"

          for file in "$CLIP_DIR"/*.mp4; do
            if [ -f "$file" ]; then
              echo "========================================="
              echo "Clip: $file"
              echo "========================================="

              ffprobe \
                -v error \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$file"
            fi
          done

      - name: Show clips manifest
        run: |
          echo "========================================="
          echo "Clips manifest:"
          echo "========================================="

          MANIFEST_FILE="data/clips/${VOD_ID}/clips_manifest.json"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Clips manifest was not generated:"
            echo "$MANIFEST_FILE"
            exit 1
          fi

          cat "$MANIFEST_FILE"

          echo
          echo "Clips manifest verified."

      - name: Test Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram configuration test:"
          echo "========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is not configured."
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: configured"
          echo "TELEGRAM_CHAT_ID: configured"

      - name: Send clips to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram clip approval:"
          echo "========================================="

          python src/telegram_approval.py

          echo
          echo "Telegram approval process completed."

      # CAMBIO AQUÍ: Verificación dinámica para soportar múltiples o diferentes JSON de VODs procesados
      - name: Check Telegram approval result
        run: |
          echo "========================================="
          echo "Telegram approval result:"
          echo "========================================="

          if [ -d "data/telegram_approved" ] && [ "$(ls -A data/telegram_approved/*_approved.json 2>/dev/null)" ]; then
            echo "✅ Archivos de aprobación encontrados:"
            ls -lh data/telegram_approved/*_approved.json
            echo "-----------------------------------------"
            cat data/telegram_approved/*_approved.json
          else
            echo "❌ ERROR: No se encontró ningún archivo de aprobación en data/telegram_approved/"
            exit 1
          fi

          echo
          echo "Telegram approval result verified."

      - name: Upload Whisper transcription
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcription-complete-test
          path: data/transcriptions/${{ env.VOD_ID }}.json
          if-no-files-found: error

      - name: Upload Gemini analysis
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-complete-test
          path: data/analysis/${{ env.VOD_ID }}_candidates.json
          if-no-files-found: error

      - name: Upload filtered candidates
        uses: actions/upload-artifact@v4
        with:
          name: filtered-candidates-test
          path: data/filtered_candidates/${{ env.VOD_ID }}_selected.json
          if-no-files-found: error

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips-test
          path: data/clips/${{ env.VOD_ID }}/*.mp4
          if-no-files-found: warn

      - name: Upload clips manifest
        uses: actions/upload-artifact@v4
        with:
          name: clips-manifest-test
          path: data/clips/${{ env.VOD_ID }}/clips_manifest.json
          if-no-files-found: error

      # CAMBIO AQUÍ: Sube dinámicamente cualquier JSON de aprobación generado
      - name: Upload Telegram approval result
        uses: actions/upload-artifact@v4
        with:
          name: telegram-approval-test
          path: data/telegram_approved/*_approved.json
          if-no-files-found: error

      # ============================================================
      # FINALIZACIÓN CORRECTA
      # ============================================================

      - name: Complete VOD pipeline test completed
        run: |
          echo "========================================="
          echo "Complete VOD pipeline test completed."
          echo "========================================="
          echo "VOD ID: $VOD_ID"
          echo "Python: OK"
          echo "FFmpeg: OK"
          echo "FFprobe: OK"
          echo "Git: OK"
          echo "Whisper: OK"
          echo "Gemini SDK: OK"
          echo "Twitch authentication: OK"
          echo "Twitch VOD discovery: OK"
          echo "Complete VOD download: OK"
          echo "Whisper transcription: OK"
          echo "Gemini analysis: OK"
          echo "Candidate filtering: OK"
          echo "Clip generation: OK"
          echo "Telegram configuration: OK"
          echo "Telegram approval: OK"
          echo "========================================="

      # ============================================================
      # AVISO DE FINALIZACIÓN EN TELEGRAM
      # ============================================================

      - name: Send successful completion message to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Sending Telegram completion message"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "🎬 Todos los clips han sido enviados.\n\n"
              "Ya puedes revisarlos en Telegram.\n\n"
              "Comandos disponibles:\n"
              "/start → Inicia un nuevo procesamiento.\n"
              "/estado → Consulta el estado del procesamiento.\n"
              "/help → Muestra los comandos disponibles."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          with urllib.request.urlopen(
              url,
              timeout=30
          ) as response:
              pass
          PY
              timeout=15,
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise RuntimeError(data)

          print(
              "Telegram completion message sent."
          )
          PY

      # ============================================================
      # AVISO AUTOMÁTICO DE FALLO
      #
      # Si cualquier paso anterior falla, GitHub ejecutará este paso.
      # Así recibes el aviso directamente en Telegram sin tener que
      # consultar /estado.
      # ============================================================

      - name: Send failure message to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "VOD pipeline failed"
          echo "========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = (
              "❌ El procesamiento ha fallado.\n\n"
              "El Proyecto 1 no ha podido completar "
              "el procesamiento del VOD.\n\n"
              "Revisa GitHub Actions para ver "
              "el paso que ha producido el error."
          )

          params = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
              }
          )

          url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage?"
              f"{params}"
          )

          try:
              with urllib.request.urlopen(
                  url,
                  timeout=15,
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(
                  "ERROR: Could not send Telegram "
                  f"failure message: {exc}"
              )
              raise SystemExit(1)

          if not data.get("ok"):
              print(
                  "ERROR: Telegram returned an error."
              )
              print(data)
              raise SystemExit(1)

          print(
              "Telegram failure message sent."
          )
          PY
