name: Complete VOD Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-vod-pipeline:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # CLEAN RUNTIME DATA
      # ============================================================

      - name: Clean previous runtime data
        run: |
          echo "========================================="
          echo "Cleaning previous runtime data"
          echo "========================================="

          rm -rf data/telegram_approved
          rm -rf data/clips
          rm -rf data/filtered_candidates
          rm -rf data/analysis
          rm -rf data/transcriptions

          mkdir -p data/telegram_approved
          mkdir -p data/clips
          mkdir -p data/filtered_candidates
          mkdir -p data/analysis
          mkdir -p data/transcriptions

          echo "Runtime directories cleaned."


      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Show system information
        run: |
          echo "Operating system:"
          uname -a
          echo

          echo "Ubuntu version:"
          lsb_release -a


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: python --version


      # ============================================================
      # FFMPEG
      # ============================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Show FFprobe version
        run: ffprobe -version | head -n 1


      # ============================================================
      # GIT
      # ============================================================

      - name: Show Git version
        run: git --version


      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # BASIC TESTS
      # ============================================================

      - name: Test Python
        run: |
          python - <<'PY'
          print("Python is working correctly.")
          PY

      - name: Test FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || exit 1
          echo "FFmpeg is installed correctly."

      - name: Test FFprobe
        run: |
          command -v ffprobe >/dev/null 2>&1 || exit 1
          echo "FFprobe is installed correctly."


      # ============================================================
      # WHISPER TEST
      # ============================================================

      - name: Test Whisper
        run: |
          python - <<'PY'
          import whisper

          print("Whisper imported successfully.")
          print(
              f"Whisper version: "
              f"{getattr(whisper, '__version__', 'unknown')}"
          )
          PY


      # ============================================================
      # GEMINI TEST
      # ============================================================

      - name: Test Gemini SDK
        run: |
          python - <<'PY'
          from google import genai

          print("Google Gemini SDK imported successfully.")
          print(f"Gemini SDK module: {genai.__name__}")
          PY


      # ============================================================
      # TWITCH AUTHENTICATION
      # ============================================================

      - name: Test Twitch authentication
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_auth.py


      # ============================================================
      # DISCOVER VOD
      # ============================================================

      - name: Discover latest Twitch VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python src/twitch_vods.py


      # ============================================================
      # DOWNLOAD VOD
      # ============================================================

      - name: Download complete VOD
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          FORCE_VOD_DOWNLOAD: "true"
        run: |
          python src/twitch_vod_downloader.py


      # ============================================================
      # SHOW PROCESSED STATE
      # ============================================================

      - name: Show processed VOD state
        run: |
          echo "========================================="
          echo "Current processed VOD state:"
          echo "========================================="

          if [ -f data/processed_vods.json ]; then
            cat data/processed_vods.json
          else
            echo "No processed VOD state file found."
          fi

          echo
          echo "========================================="


      # ============================================================
      # CHECK VOD
      # ============================================================

      - name: Check complete VOD
        run: |
          echo "========================================="
          echo "Available complete VOD files:"
          echo "========================================="

          if [ ! -d data/vods ]; then
            echo "ERROR: data/vods directory does not exist."
            exit 1
          fi

          VOD_FILE_COUNT=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 files found: $VOD_FILE_COUNT"

          if [ "$VOD_FILE_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one complete VOD MP4."
            exit 1
          fi

          VOD_FILE=$(find data/vods \
            -maxdepth 1 \
            -type f \
            -name "*.mp4")

          VOD_ID=$(basename "$VOD_FILE" .mp4)

          echo "VOD file: $VOD_FILE"
          echo "VOD ID: $VOD_ID"

          echo "VOD_ID=$VOD_ID" >> "$GITHUB_ENV"

          echo
          echo "Complete VOD download verified."


      # ============================================================
      # INSPECT VOD
      # ============================================================

      - name: Inspect complete VOD
        run: |
          echo "========================================="
          echo "Complete VOD inspection:"
          echo "========================================="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "data/vods/${VOD_ID}.mp4"


      # ============================================================
      # WHISPER
      # ============================================================

      - name: Run Whisper transcription
        run: |
          python src/whisper_transcriber.py


      # ============================================================
      # CHECK WHISPER
      # ============================================================

      - name: Check Whisper transcription
        run: |
          echo "========================================="
          echo "Whisper transcription:"
          echo "========================================="

          TRANSCRIPTION_FILE="data/transcriptions/${VOD_ID}.json"

          if [ ! -f "$TRANSCRIPTION_FILE" ]; then
            echo "ERROR: Expected Whisper output not found:"
            echo "$TRANSCRIPTION_FILE"
            exit 1
          fi

          cat "$TRANSCRIPTION_FILE"

          echo
          echo "Whisper transcription verified."


      # ============================================================
      # GEMINI
      # ============================================================

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/gemini_analyzer.py


      # ============================================================
      # CHECK GEMINI
      # ============================================================

      - name: Check Gemini analysis
        run: |
          echo "========================================="
          echo "Gemini candidates:"
          echo "========================================="

          ANALYSIS_FILE="data/analysis/${VOD_ID}_candidates.json"

          if [ ! -f "$ANALYSIS_FILE" ]; then
            echo "ERROR: Expected Gemini output not found:"
            echo "$ANALYSIS_FILE"
            exit 1
          fi

          cat "$ANALYSIS_FILE"

          echo
          echo "Gemini analysis verified."


      # ============================================================
      # FILTER
      # ============================================================

      - name: Filter candidates
        run: |
          python src/candidate_filter.py


      # ============================================================
      # CHECK FILTER
      # ============================================================

      - name: Check filtered candidates
        run: |
          echo "========================================="
          echo "Filtered candidates:"
          echo "========================================="

          FILTERED_FILE="data/filtered_candidates/${VOD_ID}_selected.json"

          if [ ! -f "$FILTERED_FILE" ]; then
            echo "ERROR: Expected filtered candidates output not found:"
            echo "$FILTERED_FILE"
            exit 1
          fi

          cat "$FILTERED_FILE"

          echo
          echo "Candidate filtering verified."


      # ============================================================
      # GENERATE CLIPS
      # ============================================================

      - name: Generate clips
        run: |
          python src/clip_generator.py


      # ============================================================
      # SHOW GENERATED CLIPS
      # ============================================================

      - name: Show generated clips
        run: |
          echo "========================================="
          echo "Generated clips:"
          echo "========================================="

          CLIP_DIR="data/clips/${VOD_ID}"

          if [ ! -d "$CLIP_DIR" ]; then
            echo "ERROR: Clip directory does not exist:"
            echo "$CLIP_DIR"
            exit 1
          fi

          find "$CLIP_DIR" -type f -print

          CLIP_COUNT=$(find "$CLIP_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo
          echo "MP4 clips found: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -eq 0 ]; then
            echo "No clips were generated."
            echo "This is valid when no candidates pass the filter."
          else
            echo
            echo "Clip generation verified."
          fi


      # ============================================================
      # INSPECT GENERATED CLIPS
      # ============================================================

      - name: Inspect generated clips
        run: |
          CLIP_DIR="data/clips/${VOD_ID}"

          for file in "$CLIP_DIR"/*.mp4; do
            if [ -f "$file" ]; then
              echo "========================================="
              echo "Clip: $file"
              echo "========================================="

              ffprobe \
                -v error \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$file"
            fi
          done


      # ============================================================
      # SHOW MANIFEST
      # ============================================================

      - name: Show clips manifest
        run: |
          echo "========================================="
          echo "Clips manifest:"
          echo "========================================="

          MANIFEST_FILE="data/clips/${VOD_ID}/clips_manifest.json"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Clips manifest was not generated:"
            echo "$MANIFEST_FILE"
            exit 1
          fi

          cat "$MANIFEST_FILE"

          echo
          echo "Clips manifest verified."


      # ============================================================
      # TELEGRAM CONFIGURATION
      # ============================================================

      - name: Test Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram configuration test:"
          echo "========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is not configured."
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: configured"
          echo "TELEGRAM_CHAT_ID: configured"


      # ============================================================
      # TELEGRAM APPROVAL
      # ============================================================

      - name: Send clips to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================="
          echo "Telegram clip approval:"
          echo "========================================="

          python src/telegram_approval.py

          echo
          echo "Telegram approval process completed."


      # ============================================================
      # CHECK TELEGRAM APPROVAL
      # ============================================================

      - name: Check Telegram approval result
        run: |
          echo "========================================="
          echo "Telegram approval result:"
          echo "========================================="

          APPROVAL_DIR="data/telegram_approved"

          APPROVAL_FILES=$(find "$APPROVAL_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*_approved.json" \
            2>/dev/null || true)

          if [ -n "$APPROVAL_FILES" ]; then
            echo "Approval files found:"
            echo "$APPROVAL_FILES"

            echo "-----------------------------------------"

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                echo "File: $file"
                cat "$file"
                echo
                echo "-----------------------------------------"
              fi
            done <<< "$APPROVAL_FILES"

            echo
            echo "Telegram approval result verified."
          else
            echo "ERROR: No approval JSON file was generated."
            exit 1
          fi


      # ============================================================
      # UPLOAD WHISPER
      # ============================================================

      - name: Upload Whisper transcription
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcription-complete-test
          path: data/transcriptions/${{ env.VOD_ID }}.json
          if-no-files-found: error


      # ============================================================
      # UPLOAD GEMINI
      # ============================================================

      - name: Upload Gemini analysis
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-complete-test
          path: data/analysis/${{ env.VOD_ID }}_candidates.json
          if-no-files-found: error


      # ============================================================
      # UPLOAD FILTERED CANDIDATES
      # ============================================================

      - name: Upload filtered candidates
        uses: actions/upload-artifact@v4
        with:
          name: filtered-candidates-test
          path: data/filtered_candidates/${{ env.VOD_ID }}_selected.json
          if-no-files-found: error


      # ============================================================
      # UPLOAD CLIPS
      # ============================================================

      - name: Upload generated clips
        id: upload_generated_clips
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips-test
          path: data/clips/${{ env.VOD_ID }}/*.mp4
          if-no-files-found: warn


      # ============================================================
      # UPLOAD MANIFEST
      # ============================================================

      - name: Upload clips manifest
        uses: actions/upload-artifact@v4
        with:
          name: clips-manifest-test
          path: data/clips/${{ env.VOD_ID }}/clips_manifest.json
          if-no-files-found: error


      # ============================================================
      # UPLOAD TELEGRAM RESULT
      # ============================================================

      - name: Upload Telegram approval result
        uses: actions/upload-artifact@v4
        with:
          name: telegram-approval-test
          path: data/telegram_approved/*_approved.json
          if-no-files-found: error


      # ============================================================
      # TEST CROSS REPO TOKEN
      # ============================================================

      - name: Test CROSS_REPO_TOKEN
        if: success()
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "🔐 COMPROBACIÓN CROSS_REPO_TOKEN"
          echo "========================================="

          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo
            echo "ERROR: GitHub Actions NO está recibiendo"
            echo "el secreto CROSS_REPO_TOKEN."
            echo
            echo "El código del workflow intenta cargar:"
            echo "\${{ secrets.CROSS_REPO_TOKEN }}"
            echo
            echo "Revisa que CROSS_REPO_TOKEN esté creado"
            echo "en Settings > Secrets and variables > Actions"
            echo "del repositorio twitch-vod-clip-agent."
            echo
            echo "IMPORTANTE:"
            echo "Debe estar en Secrets, no en Variables."
            echo "No se mostrará nunca el contenido del token."
            exit 1
          fi

          echo "CROSS_REPO_TOKEN: recibido correctamente."
          echo
          echo "Comprobando autenticación contra GitHub..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/github_user.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${CROSS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user")

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "ERROR: El CROSS_REPO_TOKEN fue recibido,"
            echo "pero GitHub rechazó la autenticación."
            echo
            echo "HTTP status: $HTTP_CODE"
            echo
            echo "Esto indica que el token puede estar"
            echo "caducado, revocado o ser incorrecto."
            exit 1
          fi

          TOKEN_LOGIN=$(python - <<'PY'
          import json

          with open("/tmp/github_user.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("login", "unknown"))
          PY
          )

          echo "Token autenticado correctamente."
          echo "Usuario GitHub asociado: $TOKEN_LOGIN"

          echo
          echo "Comprobando acceso al Proyecto 1..."

          PROJECT1_HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/project1_repo.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${CROSS_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/KuraiMure57/twitch-tiktok-agent")

          if [ "$PROJECT1_HTTP_CODE" != "200" ]; then
            echo
            echo "ERROR: El token existe y autentica,"
            echo "pero no tiene acceso al Proyecto 1."
            echo
            echo "HTTP status: $PROJECT1_HTTP_CODE"
            exit 1
          fi

          echo "Acceso al Proyecto 1 confirmado."
          echo
          echo "========================================="
          echo "CROSS_REPO_TOKEN: TODO CORRECTO"
          echo "========================================="


      # ============================================================
      # BRIDGE TO PROJECT 1
      # ============================================================

      - name: Trigger Twitch TikTok Agent for Approved Clips
        if: success()
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "🤖 PUENTE AUTOMÁTICO AL PROYECTO 1"
          echo "========================================="

          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo "ERROR: CROSS_REPO_TOKEN no está configurado."
            exit 1
          fi

          APPROVAL_FILES=$(find data/telegram_approved \
            -maxdepth 1 \
            -type f \
            -name "*_approved.json" \
            2>/dev/null || true)

          if [ -z "$APPROVAL_FILES" ]; then
            echo "No hay archivos de aprobación."
            echo "No hay clips aprobados que enviar."
            exit 0
          fi

          dispatched=0
          approved_total=0

          while IFS= read -r approval_file; do

            if [ -z "$approval_file" ]; then
              continue
            fi

            echo
            echo "-----------------------------------------"
            echo "Procesando:"
            echo "$approval_file"
            echo "-----------------------------------------"

            while IFS= read -r approval_entry; do

              if [ -z "$approval_entry" ]; then
                continue
              fi

              approved=$(python - "$approval_entry" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          if isinstance(data, dict):
              print(json.dumps(data))
          elif isinstance(data, list):
              print(json.dumps(data[0] if data else {}))
          else:
              print("{}")
          PY
              )

              if [ -z "$approved" ] || [ "$approved" = "{}" ]; then
                continue
              fi

              is_approved=$(python - "$approved" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          value = data.get("approved", False)

          if isinstance(value, str):
              value = value.lower() == "true"

          print("true" if value else "false")
          PY
              )

              if [ "$is_approved" != "true" ]; then
                continue
              fi

              approved_total=$((approved_total + 1))

              clip_filename=$(python - "$approved" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          print(data.get("clip_filename", ""))
          PY
              )

              if [ -z "$clip_filename" ]; then
                echo "ERROR: Approved clip sin clip_filename."
                exit 1
              fi

              clips_artifact_id=$(python - "$approved" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          value = (
              data.get("artifact_id")
              or data.get("clips_artifact_id")
              or data.get("generated_clips_artifact_id")
              or ""
          )

          print(value)
          PY
              )

              manifest_artifact_id=$(python - "$approved" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          value = (
              data.get("manifest_artifact_id")
              or ""
          )

          print(value)
          PY
              )

              if [ -z "$clips_artifact_id" ]; then
                echo "ERROR: No se encontró artifact_id para:"
                echo "$clip_filename"
                exit 1
              fi

              if [ -z "$manifest_artifact_id" ]; then
                echo "ERROR: No se encontró manifest_artifact_id para:"
                echo "$clip_filename"
                exit 1
              fi

              payload=$(python - "$VOD_ID" "$clip_filename" "$clips_artifact_id" "$manifest_artifact_id" <<'PY'
          import json
          import sys

          vod_id = sys.argv[1]
          clip_filename = sys.argv[2]
          artifact_id = sys.argv[3]
          manifest_artifact_id = sys.argv[4]

          payload = {
              "event_type": "vod_clips_approved",
              "client_payload": {
                  "vod_id": vod_id,
                  "artifact_id": artifact_id,
                  "manifest_artifact_id": manifest_artifact_id,
                  "clip_filename": clip_filename
              }
          }

          print(json.dumps(payload))
          PY
              )

              echo
              echo "Enviando clip aprobado al Proyecto 1:"
              echo "$clip_filename"

              HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --output /tmp/repository_dispatch_response.txt \
                --write-out "%{http_code}" \
                --request POST \
                --header "Authorization: Bearer ${CROSS_REPO_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "https://api.github.com/repos/KuraiMure57/twitch-tiktok-agent/dispatches")

              if [ "$HTTP_CODE" != "204" ]; then
                echo
                echo "ERROR: GitHub rechazó el repository_dispatch."
                echo "HTTP status: $HTTP_CODE"
                echo
                echo "Respuesta:"
                cat /tmp/repository_dispatch_response.txt || true
                exit 1
              fi

              echo "✅ Dispatch enviado correctamente."
              dispatched=$((dispatched + 1))

            done < <(
              python - "$approval_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              for item in data:
                  print(json.dumps(item))
          elif isinstance(data, dict):
              print(json.dumps(data))
          PY
            )

          done <<< "$APPROVAL_FILES"

          echo
          echo "========================================="
          echo "RESULTADO DEL PUENTE"
          echo "========================================="
          echo "Clips aprobados: $approved_total"
          echo "Clips enviados:  $dispatched"

          if [ "$approved_total" -eq 0 ]; then
            echo
            echo "No hay clips aprobados."
            echo "El pipeline termina correctamente."
            exit 0
          fi

          if [ "$dispatched" -ne "$approved_total" ]; then
            echo
            echo "ERROR: No se enviaron todos los clips aprobados."
            exit 1
          fi

          echo
          echo "Todos los clips aprobados fueron enviados"
          echo "correctamente al Proyecto 1."


      # ============================================================
      # PIPELINE SUMMARY
      # ============================================================

      - name: Pipeline summary
        if: success()
        run: |
          echo "========================================="
          echo "🎉 PIPELINE COMPLETADO"
          echo "========================================="
          echo
          echo "VOD: ${VOD_ID}"
          echo
          echo "El pipeline completo ha finalizado correctamente."


      # ============================================================
      # TELEGRAM FAILURE NOTIFICATION
      # ============================================================

      - name: Notify Telegram on pipeline failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "Telegram failure notification skipped:"
            echo "TELEGRAM_BOT_TOKEN is not configured."
            exit 0
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram failure notification skipped:"
            echo "TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi

          python - "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" "${VOD_ID:-desconocido}" <<'PY'
          import json
          import sys
          import urllib.request

          token = sys.argv[1]
          chat_id = sys.argv[2]
          vod_id = sys.argv[3]

          message = (
              "❌ Error en el pipeline de VOD\n\n"
              f"VOD: {vod_id}\n\n"
              "El procesamiento ha fallado.\n\n"
              "Revisa los logs de GitHub Actions."
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              urllib.request.urlopen(request, timeout=30)
          except Exception as exc:
              print(f"Telegram notification failed: {exc}")
